[project]
name = "luigis-agent"
version = "0.1.0"
description = "Luigi's Agent, built on Google ADK"
requires-python = ">=3.10"
dependencies = ["google-adk>=2.13.0", "python-dotenv>=1.2.4"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "mcpdoc>=0.0.10", "mcp<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["luigis_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
